<svg xmlns="http://www.w3.org/2000/svg" width="91mm" height="61mm" viewBox="0 0 91 61">
<title>Dindar Ahmed business card, Kurdish front</title>
<style>
@font-face { font-family: "Noto Kufi Arabic"; src: url("fonts/NotoKufiArabic[wght].ttf") format("truetype"); font-weight: 100 900; }
text { font-family: "Noto Kufi Arabic", sans-serif; }
</style>
<defs>
<radialGradient id="glow" cx="0" cy="0" r="0.9">
<stop offset="0" stop-color="#7161ef" stop-opacity="0.38"/>
<stop offset="1" stop-color="#7161ef" stop-opacity="0"/>
</radialGradient>
<linearGradient id="yellow" x1="1" y1="0" x2="0" y2="0">
<stop offset="0" stop-color="#ffc300"/><stop offset="1" stop-color="#ffea00"/>
</linearGradient>
</defs>
<rect width="91" height="61" fill="#000000"/>
<rect width="91" height="61" fill="url(#glow)"/>
<text x="84" y="9.4" font-size="2.3" font-weight="700" fill="#ffffff" fill-opacity="0.9" direction="rtl" unicode-bidi="embed" text-anchor="start">دیندار ئەحمەد</text>
<g font-weight="900" font-size="5.6">
<text x="84" y="37.80" fill="#ffffff" direction="rtl" unicode-bidi="embed" text-anchor="start">پێم بڵێ</text>
<text x="84" y="45.20" fill="url(#yellow)" direction="rtl" unicode-bidi="embed" text-anchor="start">چی</text>
<text x="84" y="52.60" fill="#ffffff" direction="rtl" unicode-bidi="embed" text-anchor="start">نافرۆشرێت<tspan fill="#ffc300">.</tspan></text>
</g>
</svg>
