<svg xmlns="http://www.w3.org/2000/svg" width="91mm" height="61mm" viewBox="0 0 91 61">
<title>Dindar Ahmed business card, front</title>
<style>
@font-face { font-family: "Noto Kufi Arabic"; src: url("fonts/NotoKufiArabic[wght].ttf") format("truetype"); font-weight: 100 900; }
text { font-family: "Noto Kufi Arabic", sans-serif; }
</style>
<defs>
<radialGradient id="glow" cx="0.08" cy="1.05" r="0.75">
<stop offset="0" stop-color="#7161ef" stop-opacity="0.85"/>
<stop offset="0.55" stop-color="#7161ef" stop-opacity="0.18"/>
<stop offset="1" stop-color="#7161ef" stop-opacity="0"/>
</radialGradient>
<linearGradient id="yellow" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ffc300"/><stop offset="1" stop-color="#ffea00"/>
</linearGradient>
</defs>
<rect width="91" height="61" fill="#000000"/>
<rect width="91" height="61" fill="url(#glow)"/>
<g font-weight="900" font-size="12.2" letter-spacing="-0.3">
<text x="7" y="18.6" fill="#ffffff">TELL ME</text>
<text x="7" y="31.2" fill="url(#yellow)">WHAT ISN'T</text>
<text x="7" y="43.8" fill="#ffffff">SELLING<tspan fill="#ffc300">.</tspan></text>
</g>
<g font-size="2.3" letter-spacing="0.45">
<path d="M7.8 52.05 l0.8 0.8 l-0.8 0.8 l-0.8 -0.8 z" fill="#ffc300"/>
<text x="9.6" y="53.7" fill="#ffffff" font-weight="700">DINDAR AHMED</text>
<text x="84" y="53.7" fill="#957fef" font-weight="600" text-anchor="end">DINDARAHMED.COM</text>
</g>
</svg>
