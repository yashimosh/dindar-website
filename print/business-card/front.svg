<svg xmlns="http://www.w3.org/2000/svg" width="91mm" height="61mm" viewBox="0 0 91 61">
<title>Dindar Ahmed business card, front</title>
<style>
@font-face { font-family: "Noto Kufi Arabic"; src: url("fonts/NotoKufiArabic[wght].ttf") format("truetype"); font-weight: 100 900; }
text { font-family: "Noto Kufi Arabic", sans-serif; }
</style>
<defs>
<radialGradient id="glow" cx="1" cy="0" r="0.9">
<stop offset="0" stop-color="#7161ef" stop-opacity="0.38"/>
<stop offset="1" stop-color="#7161ef" stop-opacity="0"/>
</radialGradient>
<linearGradient id="yellow" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ffc300"/><stop offset="1" stop-color="#ffea00"/>
</linearGradient>
</defs>
<rect width="91" height="61" fill="#000000"/>
<rect width="91" height="61" fill="url(#glow)"/>
<text x="7" y="8.6" font-size="1.7" font-weight="700" letter-spacing="0.55" fill="#ffffff" fill-opacity="0.9">DINDAR AHMED</text>
<g font-weight="900" font-size="5.4" letter-spacing="-0.12">
<text x="7" y="42.00" fill="#ffffff">TELL ME</text>
<text x="7" y="48.00" fill="url(#yellow)">WHAT ISN'T</text>
<text x="7" y="54.00" fill="#ffffff">SELLING<tspan fill="#ffc300">.</tspan></text>
</g>
</svg>
