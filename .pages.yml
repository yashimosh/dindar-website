# Pages CMS config. GENERATED by tools/cms/make_pages_yml.py: change that script, not this file.
# Forms come from tools/site/content_<language>.json; client logos from assets/data/clients.json.
media:
  - name: photos
    label: Photos
    input: assets/img
    output: /assets/img
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: logos
    label: Client logos
    input: assets/img/clients
    output: /assets/img/clients
    extensions: [webp, png]
    rename: safe
content:
  - name: text-en
    label: "Website text: English"
    type: file
    path: tools/site/content_en.json
    format: json
    fields:
      - name: meta
        label: "Search engines and link previews"
        type: object
        fields:
          - name: title
            label: "Title"
            type: string
          - name: description
            label: "Description"
            type: text
          - name: og_description
            label: "Preview text on Facebook and WhatsApp"
            type: text
          - name: tw_description
            label: "Preview text on X (Twitter)"
            type: text
          - name: og_locale
            label: "Language code (do not change)"
            type: string
            readonly: true
      - name: nav_cta
        label: "Menu button text"
        type: string
      - name: hero
        label: "Home page: top"
        type: object
        fields:
          - name: eyebrow
            label: "Small line above the headline"
            type: string
          - name: h1
            label: "Headline"
            type: string
          - name: p
            label: "Text"
            type: text
          - name: btn_work
            label: "Button: my work"
            type: string
          - name: btn_about
            label: "Button: about me"
            type: string
          - name: portrait_alt
            label: "Portrait photo description"
            type: string
      - name: stats
        label: "Numbers"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{n}"
        fields:
          - name: n
            label: "Number"
            type: string
          - name: label
            label: "Label"
            type: string
          - name: body
            label: "Text"
            type: text
      - name: featured
        label: "Featured work"
        type: object
        fields:
          - name: h2
            label: "Section title"
            type: string
          - name: items
            label: "Items"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{h3}"
            fields:
              - name: tags
                label: "Tags"
                type: string
                list: true
              - name: h3
                label: "Title"
                type: string
              - name: p
                label: "Text"
                type: text
              - name: img
                label: "Image file name (upload it under Photos first)"
                type: string
              - name: alt
                label: "Image description (for screen readers)"
                type: string
      - name: cases
        label: "Case studies"
        type: object
        fields:
          - name: h2
            label: "Section title"
            type: string
          - name: sub
            label: "Section subtitle"
            type: string
          - name: items
            label: "Items"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: tag
                label: "Tag"
                type: string
              - name: name
                label: "Name"
                type: string
              - name: period
                label: "Period"
                type: string
              - name: body
                label: "Text"
                type: text
              - name: metric
                label: "Result"
                type: string
      - name: campaigns
